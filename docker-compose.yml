services:
  hermes:
    build:
      context: .
      dockerfile: Dockerfile
    image: hermes-agent-sandbox:latest
    container_name: hermes-agent-sandbox
    network_mode: "bridge"
    extra_hosts:
      - host.docker.internal:127.0.0.1
      - gateway.docker.internal:127.0.0.1
    security_opt:
      - no-new-privileges:true
    ipc: private
    pids_limit: 1024
    mem_limit: 2g
    cpus: 2
    working_dir: /workspace
    volumes:
      - type: bind
        source: ${HOST_WORKSPACE_DIR:-.}
        target: /workspace
        read_only: false
        bind:
          propagation: rprivate
      - hermes-data:/root
    environment:
      - BWS_ACCESS_TOKEN
    stdin_open: true
    tty: true

volumes:
  hermes-data:
